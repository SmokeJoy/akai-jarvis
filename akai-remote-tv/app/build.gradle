plugins {
    id 'com.android.application'
}

android {
    namespace 'it.akai.customremote'
    compileSdk 28

    defaultConfig {
        applicationId "it.akai.customremote"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
}

dependencies {
    // Zero bloated third-party frameworks. Pure Android SDK for minimal RAM footprint (<10 MB).
}
