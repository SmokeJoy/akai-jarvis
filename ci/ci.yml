name: AKAI JARVIS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-tests:
    name: Code Quality, Unit Tests & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Syntax Check Web Remote JavaScript
        run: |
          echo "=== Syntax Checking Web Remote JS ==="
          node --check akai-remote-web/app.js
          node --check akai-remote-web/sw.js
          echo "JavaScript syntax check passed."

      - name: 2. Secrets Leak Detection
        run: |
          echo "=== Scanning for leaked private keys or hardcoded API credentials ==="
          # Check for forbidden private key files
          FORBIDDEN_FILES=$(find . -type f \( -name "*.p12" -o -name "*.jks" -o -name "*.keystore" \) -not -path "*/.*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Forbidden private keystores detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

          # Check for real api key patterns
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --exclude-dir=".git" .; then
            echo "ERROR: Potential real API key detected in source tree!"
            exit 1
          fi
          echo "Secrets scan passed: zero private keystores or unmasked API keys detected."

      - name: 3. Compile and Run Host Java Unit Tests
        run: |
          echo "=== Compiling and Running Java UnitTests ==="
          mkdir -p test_bin
          javac -encoding UTF-8 -d test_bin \
            akai-remote-tests/host_mock/android/content/*.java \
            akai-remote-tests/host_mock/android/util/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/qr/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/SecurityManager.java \
            akai-remote-tests/UnitTests.java

          java -cp test_bin it.akai.customremote.UnitTests
          echo "All Java unit tests passed with 100% success."
