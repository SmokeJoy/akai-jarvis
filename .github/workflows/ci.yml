name: AKAI JARVIS CI

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-tests:
    name: Code Quality, Unit Tests, SQLite, Android APK & ARMv7 JNI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Syntax Check Web Remote JavaScript
        run: |
          echo "=== Syntax Checking Web Remote JS ==="
          node --check akai-remote-web/app.js
          node --check akai-remote-web/sw.js
          echo "JavaScript syntax check passed."

      - name: 2. Secrets Leak Detection
        run: |
          echo "=== Scanning for leaked private keys or hardcoded API credentials ==="
          FORBIDDEN_FILES=$(find . -type f \( -name "*.p12" -o -name "*.jks" -o -name "*.keystore" \) -not -path "*/.*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Forbidden private keystores detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --exclude-dir=".git" .; then
            echo "ERROR: Potential real API key detected in source tree!"
            exit 1
          fi
          echo "Secrets scan passed: zero private keystores or unmasked API keys detected."

      - name: 3. Real SQLite Database Integrity & v5->v6 Migration Test
        run: |
          echo "=== Running Real SQLite Database & Migration Tests ==="
          python3 akai-remote-tests/test_sqlite_memory.py
          echo "SQLite persistence, v5->v6 migration and Guest Mode privacy verified on real database engine."

      - name: 4. Compile and Run Host Java Unit Tests (17 Tests)
        run: |
          echo "=== Compiling and Running Java UnitTests ==="
          mkdir -p test_bin
          javac -encoding UTF-8 -d test_bin \
            akai-remote-tests/host_mock/android/content/*.java \
            akai-remote-tests/host_mock/android/graphics/*.java \
            akai-remote-tests/host_mock/android/util/*.java \
            akai-remote-tests/host_mock/org/json/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/qr/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/SecurityManager.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/UInputDriver.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/CommandResult.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/RestApiRouter.java \
            akai-remote-tests/UnitTests.java

          java -cp test_bin it.akai.customremote.UnitTests
          echo "All 17 Java unit tests passed with 100% success."

      - name: 5. Native JNI C Driver ARMv7 Compilation & ABI Verification
        run: |
          echo "=== Compiling Native JNI Driver (uinput_jni.c) for ARMv7 ==="
          mkdir -p build_ci/lib/armeabi-v7a

          NDK_CLANG=$(find "$ANDROID_HOME/ndk" "$ANDROID_NDK_ROOT" /usr/local/lib/android/sdk/ndk -name "armv7a-linux-androideabi21-clang" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_CLANG" ]; then
            echo "Using Android NDK Clang ARMv7: $NDK_CLANG"
            "$NDK_CLANG" -shared -fPIC -O2 -llog akai-remote-tv/app/src/main/jni/uinput_jni.c -o build_ci/lib/armeabi-v7a/libakai_uinput.so
          else
            echo "Android NDK Clang not found in standard paths; installing gcc-arm-linux-gnueabihf cross-compiler..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
            mkdir -p /tmp/jni_include/android
            cat << 'EOF' > /tmp/jni_include/android/log.h
            #pragma once
            #define ANDROID_LOG_INFO 4
            #define ANDROID_LOG_ERROR 6
            static inline int __android_log_print(int prio, const char* tag, const char* fmt, ...) { (void)prio; (void)tag; (void)fmt; return 0; }
            EOF

            arm-linux-gnueabihf-gcc -shared -fPIC -O2 \
              -I"$JAVA_HOME/include" \
              -I"$JAVA_HOME/include/linux" \
              -I/tmp/jni_include \
              akai-remote-tv/app/src/main/jni/uinput_jni.c \
              -o build_ci/lib/armeabi-v7a/libakai_uinput.so
          fi

          if [ ! -f build_ci/lib/armeabi-v7a/libakai_uinput.so ]; then
            echo "ERROR: Native JNI compilation failed."
            exit 1
          fi

          SO_SIZE=$(stat -c%s build_ci/lib/armeabi-v7a/libakai_uinput.so)
          echo "Native JNI Driver successfully compiled: $SO_SIZE bytes."
          echo "--- ABI Verification ---"
          file build_ci/lib/armeabi-v7a/libakai_uinput.so
          readelf -h build_ci/lib/armeabi-v7a/libakai_uinput.so | grep -E "Class|Machine|Flags"
          echo "ARM ABI confirmed."

      - name: 6. Full Android Production APK Build & Packaging (D8, AAPT2, ZipAlign, Apksigner)
        run: |
          echo "=== Building Complete Production Android APK ==="
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$ANDROID_JAR" ] || [ -z "$AAPT2" ] || [ -z "$D8" ] || [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "ERROR: Missing required Android SDK build tools (aapt2, d8, zipalign, apksigner)"
            exit 1
          fi

          echo "Using Android platform: $ANDROID_JAR"
          echo "Using AAPT2: $AAPT2"
          echo "Using D8: $D8"
          echo "Using ZipAlign: $ZIPALIGN"
          echo "Using Apksigner: $APKSIGNER"

          mkdir -p build_ci/gen build_ci/classes build_ci/dex

          # 1. AAPT2 compile resources
          "$AAPT2" compile --dir akai-remote-tv/app/src/main/res -o build_ci/compiled_res.zip

          # 2. AAPT2 link manifest and generate R.java
          "$AAPT2" link -I "$ANDROID_JAR" \
            --manifest akai-remote-tv/app/src/main/AndroidManifest.xml \
            -o build_ci/base.apk \
            --java build_ci/gen \
            build_ci/compiled_res.zip \
            --auto-add-overlay \
            --min-sdk-version 21 \
            --target-sdk-version 28

          # 3. Compile all 26 Java sources with javac
          JAVA_SRC=$(find akai-remote-tv/app/src/main/java build_ci/gen -name "*.java")
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -cp "$ANDROID_JAR" -d build_ci/classes $JAVA_SRC
          CLASS_COUNT=$(find build_ci/classes -name "*.class" | wc -l)
          echo "Java compilation succeeded: $CLASS_COUNT class files generated."

          # 4. Generate Dalvik Executable (classes.dex) with D8
          CLASS_FILES=$(find build_ci/classes -name "*.class")
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output build_ci/dex $CLASS_FILES

          # 5. Assemble APK: inject classes.dex and native JNI ARMv7 library
          (cd build_ci/dex && zip -u ../base.apk classes.dex)
          if [ -f build_ci/lib/armeabi-v7a/libakai_uinput.so ]; then
            (cd build_ci && zip -u base.apk lib/armeabi-v7a/libakai_uinput.so)
          fi

          # 6. ZipAlign 4-byte boundary
          "$ZIPALIGN" -f -v 4 build_ci/base.apk build_ci/aligned.apk

          # 7. Generate ephemeral CI debug keystore and sign APK
          keytool -genkey -v -keystore /tmp/ci_debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug CI,O=AKAI JARVIS,C=IT"
          "$APKSIGNER" sign --ks /tmp/ci_debug.keystore --ks-pass pass:android --key-pass pass:android --out build_ci/app-ci-debug.apk build_ci/aligned.apk

          # 8. Verify APK integrity and signature schemes (v1 + v2)
          "$APKSIGNER" verify --verbose build_ci/app-ci-debug.apk
          APK_SIZE=$(stat -c%s build_ci/app-ci-debug.apk)
          echo "COMPLETE ANDROID APK BUILT AND VERIFIED: $APK_SIZE bytes."
