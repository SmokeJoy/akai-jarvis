name: AKAI JARVIS CI

on:
  # The JARVIS final-agent branch must be built on its exact pushed HEAD.
  # Previously only main/fix branches were eligible for push checks.
  push:
    branches: [ main, "fix/*", "feat/jarvis-final-agent-ota-foundation-20261117" ]
  pull_request:
    branches: [ main, "fix/*", "feat/a2-*", "feat/jarvis-agent-a0-memory-learning", "feat/jarvis-a1-integration-candidate" ]
  # Manual re-run without an artificial code commit (available when workflow
  # exists on repository default branch; not a way around account-runner limits).
  workflow_dispatch:


# Cancel stale in-progress runs on the SAME PR when automation pushes a new
# commit. This saves private-runner credits without skipping any final HEAD CI.
# A completed PASS belongs only to its own exact commit SHA.
concurrency:
  group: akai-jarvis-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-tests:
    name: Code Quality, Unit Tests, SQLite, Android APK & ARMv7 JNI Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify MediaProjection STOP startup race source contract
        run: python3 akai-remote-tests/test_visual_stop_source.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Syntax Check Web Remote JavaScript
        run: |
          echo "=== Syntax Checking Web Remote JS ==="
          node --check akai-remote-web/app.js
          node --check akai-remote-web/sw.js
          echo "JavaScript syntax check passed."

      - name: 1a. Web AI feedback regression (handled HTTP 400 vs verified result)
        run: node akai-remote-tests/test_web_ai_feedback.js

      - name: 1a2. Optional local Italian Web Remote voice (no cloud TTS)
        run: node akai-remote-tests/test_web_local_italian_voice.js

      - name: 1a2b. Web Remote conversation lifecycle recovery & turnId race guard
        run: node akai-remote-tests/test_web_convo_lifecycle.js

      - name: 1a3. Owner-offline OTA release key and manifest tools syntax and actual APK evidence audit
        run: |
          node --check scripts/13_create_ota_release_trust.mjs
          node --check scripts/14_sign_ota_release_manifest.mjs
          node --check scripts/18_prepare_ota_staging.mjs
          node --check scripts/lib/ota_release_apk_proof.mjs
          node akai-remote-tests/test_ota_release_apk_proof.mjs
          node akai-remote-tests/test_ota_staging_channel.mjs
          # Never execute owner-offline cryptographic key generation in Actions.
          grep -q 'process.env.CI' scripts/13_create_ota_release_trust.mjs
          grep -q 'process.env.CI' scripts/14_sign_ota_release_manifest.mjs
          grep -q 'process.env.CI' scripts/18_prepare_ota_staging.mjs
          grep -q 'aes-256-cbc' scripts/13_create_ota_release_trust.mjs
          grep -q 'aes-256-cbc' scripts/18_prepare_ota_staging.mjs
          grep -q 'AkaiJarvisOtaStagingTrust' scripts/18_prepare_ota_staging.mjs
          grep -q 'STAGING_ONLY_DO_NOT_PUBLISH_PUBLICLY' scripts/18_prepare_ota_staging.mjs
          ! grep -q 'AkaiJarvisOtaReleaseTrust' scripts/18_prepare_ota_staging.mjs
          grep -q 'proveActualOwnerSignedApk' scripts/14_sign_ota_release_manifest.mjs
          echo 'Offline key & isolated staging tooling parse; actual APK signature, staging isolation and manifest evidence tested, no production key generated in CI.'

      - name: 1b. Parse and safety-audit Windows A1 candidate build script
        shell: pwsh
        run: |
          $path = Join-Path $PWD "scripts/09_build_jarvis_a1_candidate.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $src = Get-Content $path -Raw
          if ($src -notmatch '--version-code\s+\$VersionCode\s+--version-name\s+\$VersionName') { throw "Versioned APK link missing" }
          if ($src -notmatch '21c2c41dc4c34576cca14ad5404e87d1c5a07ace961c0fab96d128c2164a51ed') { throw "Expected on-TV signer missing" }
          if ($src -notmatch 'AkaiJarvisBuilds') { throw "Out-of-tree build output missing" }
          if ($src -match 'Remove-Item\s+\$buildDir') { throw "Builder must not delete build directories" }
          if ($src -match '\badb\s+(install|root|push|pull|connect)\b') { throw "Builder must not touch TV" }
          if ($src -notmatch 'ffe04f6b6861cf1e253bbfbf113cbb8364c22f9b') { throw "Fallback JNI provenance gate missing" }
          if ($src -notmatch 'ExtractToFile\(\$entry,\s*\$soTarget\)') { throw "Fallback extraction gate missing" }
          if ($src -notmatch 'verify --print-certs \$baselineApk') { throw "Original APK signer verification missing" }
          Write-Host "A1 Windows candidate script parses and static release guards pass (no Windows hardware build in CI)."

      - name: 1c. Parse final owner-signed APK build recipe and enforce no-deploy gates
        shell: pwsh
        run: |
          $path = Join-Path $PWD "scripts/12_build_jarvis_final_candidate.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $src = Get-Content $path -Raw
          if ($src -notmatch 'VersionCode = 4') { throw 'Diagnostic vCode4 default required' }
          if (-not $src.Contains('$VersionName -match ''(?i)(diagnostic|debug)''')) { throw 'Release must refuse diagnostic versionName' }
          if (-not $src.Contains('$VersionName -notmatch ''(?i)diagnostic''')) { throw 'Diagnostic must keep explicit versionName tag' }
          if ($src -notmatch 'ValidateSet\(''Diagnostic'', ''Release''\)') { throw 'Explicit build profiles missing' }
          if ($src -notmatch '\$BuildProfile -eq ''Diagnostic''' -or $src -notmatch '\$VersionCode -ne 4') { throw 'Diagnostic v4 version gate missing' }
          if ($src -notmatch '\$BuildProfile -eq ''Release''' -or $src -notmatch '\$VersionCode -lt 5') { throw 'Non-debuggable v5+ version gate missing' }
          if ($src -notmatch 'linkArgs \+= ''--debug-mode''') { throw 'AAPT2 diagnostic debuggable injection missing' }
          if ($src -notmatch "'--replace-version'") { throw 'AAPT2 must override manifest v3 with diagnostic v4/release v5' }
          if ($src -notmatch '\$minimumBuildToolsVersion\s*=\s*\[version\]''34\.0\.0''') { throw 'Windows builder must require SDK build-tools supporting replace-version' }
          if ($src -notmatch 'Get-ChildItem -LiteralPath \$buildToolsRoot -Directory' -or
              $src -notmatch 'Sort-Object \{ \[version\]\$_\.Name \} -Descending') { throw 'Windows builder must select latest compatible installed Android tools' }
          if ($src -match '\$buildToolsDir\s*=\s*Join-Path \$sdkDir ["'']build-tools\\28\.0\.3') { throw 'Windows builder must NOT pin obsolete build-tools 28.0.3' }
          if ($src -notmatch 'Android target resta API28') { throw 'Windows AAPT2 upgrade must preserve Android 9 target' }
          foreach ($needed in @('aapt2.exe', 'aapt.exe', 'zipalign.exe', 'lib\d8.jar', 'lib\apksigner.jar')) {
            if (-not $src.Contains("'$needed'")) { throw "Windows builder missing required SDK tool: $needed" }
          }
          if ($src -notmatch 'DIAGNOSTIC FAIL-CLOSED' -or $src -notmatch 'RELEASE FAIL-CLOSED') { throw 'Compiled manifest debug profile guards missing' }
          if ($src -notmatch 'buildProfile = \$BuildProfile' -or $src -notmatch 'debuggable = \(\$BuildProfile') { throw 'Build provenance profile metadata missing' }
          if ($src -notmatch 'feat/jarvis-final-agent-ota-foundation-20261117') { throw 'Wrong source branch' }
          if ($src -notmatch '\[string\]\$ExpectedCiHeadSha') { throw 'Exact CI HEAD SHA parameter missing' }
          if ($src -notmatch '\$actualHeadSha -ne \$ExpectedCiHeadSha\.ToLowerInvariant\(\)') { throw 'Local HEAD must match explicitly approved CI SHA' }
          if ($src -notmatch 'FIRMA DIVERSA DA TV') { throw 'Signer gate missing' }
          if ($src -notmatch 'JARVIS_SIGNING_STOREPASS' -or $src -notmatch 'JARVIS_SIGNING_KEYPASS') { throw 'Private signer env vars missing' }
          if ($src -match 'pass:android|debug.keystore|New-SelfSignedCertificate|keytool -genkey') { throw 'Debug or self-generated signer forbidden in final candidate' }
          if ($src -match '(?i)\badb(?:\.exe)?\s+(install|root|push|pull|connect|shell)\b') { throw 'Final build script must never touch TV' }
          if ($src -notmatch 'Get-FileHash.*SHA256') { throw 'APK checksum missing' }
          if ($src -notmatch 'apksigner') { throw 'APK signing verification missing' }
          if ($src -notmatch '\$alignmentResult\s*=\s*&\s*\$zipalign\s+-c\s+-p\s+4\s+\$releaseApk') { throw 'Signed APK alignment verification missing' }
          if ($src -notmatch 'signed APK zipalign verification failed') { throw 'Signed APK alignment must fail closed' }
          if ($src -notmatch 'if \(-not \(Test-Path -LiteralPath \$aaptCli -PathType Leaf\)\)') { throw 'Missing fail-closed aapt.exe availability gate' }
          if ($src -notmatch '\$LASTEXITCODE -ne 0 -or \[string\]::IsNullOrWhiteSpace\(\$xmlTree\)') { throw 'Missing fail-closed compiled manifest inspection gate' }
          if ($src -match 'if \(Test-Path \$aaptCli\)') { throw 'Optional debuggable verification forbidden' }
          foreach ($entry in @('classes.dex', 'lib/armeabi-v7a/libakai_uinput.so', 'assets/www/index.html')) {
            if (-not $src.Contains("'$entry'")) { throw "Mandatory APK component verification missing: $entry" }
          }
          if ($src -notmatch 'GetEntry\(\$required\)' -or $src -notmatch '\$requiredEntry\.Length -le 0') { throw 'Mandatory APK entry must exist and be nonempty' }
          if ($src -notmatch '\$entryNames\.Add\(\$entry\.FullName\)') { throw 'Duplicate ZIP entry rejection missing' }
          if ($src -notmatch 'finally\s*\{\s*\$zipTest\.Dispose\(\)') { throw 'ZIP handle must close even when a gate fails' }
          # Execute the same PowerShell regex used by the APK ZIP security gate.
          # A doubled backslash in a single-quoted PowerShell regex fails to match '.key'.
          $forbiddenExtension = [regex]::Match($src, [regex]::Escape('$entry.FullName') + "\s+-match\s+'([^']*p12[^']*)'")
          if (-not $forbiddenExtension.Success) { throw 'APK forbidden-extension regex missing' }
          $extensionPattern = $forbiddenExtension.Groups[1].Value
          # The owner-only PUBLIC OTA SPKI .der is a deliberate allowlisted
          # exception; ALL other .der names (e.g. private TLS/CA material)
          # remain prohibited and are tested, not silently exempted.
          if ($src -notmatch [regex]::Escape("FullName -match '\.der\z'") -or
              $src -notmatch [regex]::Escape("FullName -ne 'assets/ota-release-public.der'")) {
            throw 'APK must explicitly block other .der files while allowing only the pinned public OTA key'
          }
          foreach ($filename in @('assets/private.key', 'assets/secret.jks', 'assets/cert.p12', 'assets/ca.crt', 'assets/tls.der', 'assets/password.pass')) {
            $forbidden = ($filename -match $extensionPattern) -or
                         ($filename -match '\.der\z' -and $filename -ne 'assets/ota-release-public.der')
            if (-not $forbidden) { throw "Private APK material was not rejected: $filename" }
          }
          foreach ($filename in @('assets/www/index.html', 'assets/www/app.js', 'assets/public.svg', 'assets/certificate.crt.txt', 'assets/ota-release-public.der')) {
            $forbidden = ($filename -match $extensionPattern) -or
                         ($filename -match '\.der\z' -and $filename -ne 'assets/ota-release-public.der')
            if ($forbidden) { throw "Benign/public APK asset falsely rejected: $filename" }
          }
          Write-Host 'Final v4 source-only build recipe parses and is gated; no APK/device built in this step.'

      - name: 1c2. Rescue builder, portable recovery bundle & OTA readiness PowerShell gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($rel in @(
            'scripts/15_build_jarvis_a2_rescue.ps1',
            'scripts/16_export_portable_recovery_bundle.ps1',
            'scripts/17_check_ota_provisioning_readiness.ps1',
            'akai-remote-tests/test_portable_recovery_bundle.ps1',
            'akai-remote-tests/test_a2_rescue_builder_gates.ps1'
          )) {
            $path = Join-Path $PWD $rel
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$rel : $($_.Message)" }
              exit 1
            }
            $src = Get-Content $path -Raw
            if ($src -match '(?i)\badb(?:\.exe)?\s+(install|root|push|pull|connect|shell)\b') {
              throw "Script $rel must never invoke real ADB device commands"
            }
          }
          Write-Host 'Scripts 15/16/17 and bundle test suite parse cleanly with zero real ADB commands.'

      - name: 1d. Android JNI Bionic and secret-free packaging source regressions
        run: python3 akai-remote-tests/test_android_jni_ci_contract.py

      - name: 1e. Backup Memory REST must require HTTPS and a verified CA
        run: python3 akai-remote-tests/test_backup_memory_transport_policy.py

      - name: 2. Secrets Leak Detection
        run: |
          echo "=== Scanning for leaked private keys or hardcoded API credentials ==="
          FORBIDDEN_FILES=$(find . -type f \( -name "*.p12" -o -name "*.jks" -o -name "*.keystore" \) -not -path "*/.*" -not -path "./build_ci/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Forbidden private keystores detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --exclude-dir=".git" --exclude-dir="build_ci" .; then
            echo "ERROR: Potential real API key detected in source tree!"
            exit 1
          fi
          echo "Secrets scan passed: zero private keystores or unmasked API keys detected."

      - name: 3. Real SQLite Database Integrity, Migration & Offline Rollback Simulation
        run: |
          echo "=== Running Real SQLite Database & Migration Tests ==="
          python3 akai-remote-tests/test_sqlite_memory.py
          python3 akai-remote-tests/test_agent_sqlite_a0.py
          echo "=== Running Offline Rollback & 15MB Storage Budget Simulation ==="
          python3 akai-remote-tests/test_rollback_offline_simulation.py
          echo "SQLite persistence, v5->v6 migration, offline rollback, and budget enforcement verified on real engine."

      - name: 4. Compile and Run Host Java Unit Tests (40 Tests)
        run: |
          echo "=== Compiling and Running Java UnitTests ==="
          mkdir -p test_bin
          javac -encoding UTF-8 -d test_bin \
            akai-remote-tests/host_mock/android/content/*.java \
            akai-remote-tests/host_mock/android/content/pm/*.java \
            akai-remote-tests/host_mock/android/graphics/*.java \
            akai-remote-tests/host_mock/android/media/*.java \
            akai-remote-tests/host_mock/android/security/keystore/*.java \
            akai-remote-tests/host_mock/android/util/*.java \
            akai-remote-tests/host_mock/android/view/accessibility/*.java \
            akai-remote-tests/host_mock/org/json/*.java \
            akai-remote-tests/host_mock/it/akai/customremote/*.java \
            akai-remote-tests/host_mock/it/akai/customremote/ai/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/qr/*.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ServiceStateListener.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/HttpsRebindController.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/SecurityManager.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/UInputDriver.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/CommandResult.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/TvAppPackages.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/TvInputIntentPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/TlsCertificateManager.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/RestApiRouter.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/LocalIntentParser.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/AgentSkillGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/AgentFactMemory.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/KeystoreSecurityHelper.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudProviderPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudVisionRequestPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/FreeItalianTtsPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualObservationBridge.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualCaptureSessionGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/FrameSequenceGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/ProcedureGoalMatcher.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualObservationProvider.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualStepPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/AiProviderAdapter.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/ScreenPerceptionEngine.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/GoalEvidenceVerifier.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/UiClickTargetGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisionCapturePolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/RgbaFramePacker.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/AkaiAiController.java \
            akai-remote-tests/UnitTests.java \
            akai-remote-tests/AgentSkillGateTest.java \
            akai-remote-tests/AgentFactMemoryTest.java \
            akai-remote-tests/KeystoreCredentialHealthTest.java \
            akai-remote-tests/TvInputGoalVerificationTest.java

          java -cp test_bin it.akai.customremote.UnitTests
          java -cp test_bin it.akai.customremote.AgentSkillGateTest
          java -cp test_bin it.akai.customremote.AgentFactMemoryTest
          java -cp test_bin it.akai.customremote.KeystoreCredentialHealthTest
          java -cp test_bin it.akai.customremote.TvInputGoalVerificationTest
          echo "All 40 Java unit tests + Keystore + TvInputGoalVerificationTest passed with 100% success."

      - name: 4b. V4 OTA archive/manifest signature and exact upgrade policy gates (JDK 8)
        run: |
          mkdir -p test_ota
          javac -encoding UTF-8 -source 8 -target 8 -d test_ota \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaCandidateGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaArchiveIdentityGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaSignedReleaseManifest.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaPinnedReleaseKey.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaHttpsTransport.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaStagingCommit.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaInstallReadinessGate.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/OtaSessionByteTransfer.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VerifiedAtomicFileCopy.java \
            akai-remote-tests/OtaCandidateGateTest.java \
            akai-remote-tests/OtaArchiveIdentityGateTest.java \
            akai-remote-tests/OtaSignedReleaseManifestTest.java \
            akai-remote-tests/OtaPinnedReleaseKeyTest.java \
            akai-remote-tests/OtaHttpsTransportTest.java \
            akai-remote-tests/OtaStagingCommitTest.java \
            akai-remote-tests/OtaInstallReadinessGateTest.java \
            akai-remote-tests/OtaSessionByteTransferTest.java \
            akai-remote-tests/VerifiedAtomicFileCopyTest.java
          java -cp test_ota it.akai.customremote.OtaCandidateGateTest
          java -cp test_ota it.akai.customremote.OtaArchiveIdentityGateTest
          java -cp test_ota it.akai.customremote.OtaSignedReleaseManifestTest
          java -cp test_ota it.akai.customremote.OtaPinnedReleaseKeyTest
          java -cp test_ota it.akai.customremote.OtaHttpsTransportTest
          java -cp test_ota it.akai.customremote.OtaStagingCommitTest
          java -cp test_ota it.akai.customremote.OtaInstallReadinessGateTest
          java -cp test_ota it.akai.customremote.OtaSessionByteTransferTest
          java -cp test_ota it.akai.customremote.VerifiedAtomicFileCopyTest
          echo "Archive/staging policy gates passed; OTA real-device download, owner UI and installation remain unverified."

      - name: 4b2. Signed OTA Provisioning E2E (RSA-3072 trust, channel & A2 rescue v5->v6 upgrade + Script 17 readiness)
        run: node akai-remote-tests/test_ota_provisioning_e2e.mjs

      - name: 4b3. On-TV owner-confirmed OTA UI & PackageInstaller wiring checks
        run: python3 akai-remote-tests/test_ota_owner_ui_wiring.py

      - name: 4c. DeepSeek/Kimi-only provider guard (no local AI models)
        run: |
          mkdir -p test_providers
          javac -encoding UTF-8 -source 8 -target 8 -d test_providers \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudProviderPolicy.java \
            akai-remote-tests/CloudProviderPolicyTest.java
          java -cp test_providers it.akai.customremote.CloudProviderPolicyTest

      - name: 4d. Cloud image consent gate (DeepSeek/Kimi only, no upload)
        run: |
          mkdir -p test_vision
          javac -encoding UTF-8 -source 8 -target 8 -d test_vision \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudProviderPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudVisionRequestPolicy.java \
            akai-remote-tests/CloudVisionRequestPolicyTest.java
          java -cp test_vision it.akai.customremote.CloudVisionRequestPolicyTest

      - name: 4e. Single-use vision-to-planner bridge (fresh UI, no local LLM)
        run: |
          mkdir -p test_visual_bridge
          javac -encoding UTF-8 -source 8 -target 8 -d test_visual_bridge \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudProviderPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualObservationBridge.java \
            akai-remote-tests/VisualObservationBridgeTest.java
          java -cp test_visual_bridge it.akai.customremote.VisualObservationBridgeTest

      - name: 4f. Android 9 multi-frame session lifecycle gate (no pixels or API calls)
        run: |
          mkdir -p test_capture_session
          javac -encoding UTF-8 -source 8 -target 8 -d test_capture_session \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/CloudProviderPolicy.java \
            akai-remote-tv/app/src/main/java/it/akai/customremote/ai/VisualCaptureSessionGate.java \
            akai-remote-tests/VisualCaptureSessionGateTest.java
          java -cp test_capture_session it.akai.customremote.VisualCaptureSessionGateTest

      - name: 4f2. MediaProjection overlapping-request regression (source contract)
        run: python3 akai-remote-tests/test_visual_projection_request_serialization.py

      - name: 4f3. Android 9 idle capture power and memory regression
        run: python3 -m unittest akai-remote-tests/test_visual_projection_idle_surface.py -v

      - name: 4f4. ImageReader frame sequence freshness across app switches
        run: |
          mkdir -p test_frame_sequence
          javac -encoding UTF-8 -source 8 -target 8 -d test_frame_sequence \
