      - name: 5. Native JNI C Driver ARMv7 Compilation & ABI Verification
        run: |
          echo "=== Compiling Native JNI Driver (uinput_jni.c) for ARMv7 ==="
          mkdir -p build_ci/lib/armeabi-v7a

          # Only Android NDK builds Android/Bionic-compatible JNI libraries.
          # A generic ARM Linux GCC can emit a valid ELF machine=ARM SO linked
          # against glibc which Android cannot load. Never accept that fallback.
          NDK_CLANG=$(find "$ANDROID_HOME/ndk" "${ANDROID_NDK_ROOT:-/nonexistent}" /usr/local/lib/android/sdk/ndk -name "armv7a-linux-androideabi21-clang" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_CLANG" ] || [ ! -x "$NDK_CLANG" ]; then
            echo "NO-GO: Android NDK ARMv7 API21 clang required; Linux glibc cross-GCC is NOT equivalent."
            exit 1
          fi
          echo "Using Android NDK Clang ARMv7: $NDK_CLANG"
          "$NDK_CLANG" -shared -fPIC -O2 akai-remote-tv/app/src/main/jni/uinput_jni.c -llog -o build_ci/lib/armeabi-v7a/libakai_uinput.so

          if [ ! -f build_ci/lib/armeabi-v7a/libakai_uinput.so ]; then
            echo "ERROR: Native JNI compilation failed."
            exit 1
          fi

          SO_SIZE=$(stat -c%s build_ci/lib/armeabi-v7a/libakai_uinput.so)
          echo "Native JNI Driver successfully compiled: $SO_SIZE bytes."
          echo "--- ABI Verification ---"
          file build_ci/lib/armeabi-v7a/libakai_uinput.so
          readelf -h build_ci/lib/armeabi-v7a/libakai_uinput.so | grep -E "Class|Machine|Flags"
          readelf -h build_ci/lib/armeabi-v7a/libakai_uinput.so | grep -Eq 'Machine:[[:space:]]*ARM' || (echo 'NO-GO: not an ARM ELF library' && exit 1)
          readelf -h build_ci/lib/armeabi-v7a/libakai_uinput.so | grep -Eq 'Class:[[:space:]]*ELF32' || (echo 'NO-GO: not ELF32' && exit 1)
          readelf -d build_ci/lib/armeabi-v7a/libakai_uinput.so > build_ci/jni_dynamic.txt
          if grep -Eq 'libc\.so\.6|libgcc_s\.so|ld-linux|glibc' build_ci/jni_dynamic.txt; then
            echo 'NO-GO: Linux/glibc dependency in Android JNI library'; exit 1
          fi
          grep -Eq 'Shared library: \[liblog\.so\]' build_ci/jni_dynamic.txt || (echo 'NO-GO: Android liblog dependency missing' && exit 1)
          echo "Android NDK/Bionic-compatible ARMv7 JNI ABI verified (not an OEM runtime test)."

      - name: 6. Full Android Production APK Build & Packaging (D8, AAPT2, ZipAlign, Apksigner)
        run: |
          echo "=== Building Complete Android APK for CI Verification ==="
          
          # Tentativo di targeting prioritario su android-28 (Android TV 9 Pie)
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | grep "android-28" | head -n 1)
          if [ -z "$ANDROID_JAR" ]; then
            echo "android-28 not present by default. Attempting installation via sdkmanager..."
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager "platforms;android-28" >/dev/null 2>&1 || true
            elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" >/dev/null 2>&1 || true
            fi
            ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | grep "android-28" | head -n 1)
          fi
          if [ -z "$ANDROID_JAR" ]; then
            echo "NO-GO: Android 9 platform API28 is required. Newer SDKs are NOT an equivalent compile proof."
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$ANDROID_JAR" ] || [ -z "$AAPT2" ] || [ -z "$D8" ] || [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "ERROR: Missing required Android SDK build tools (aapt2, d8, zipalign, apksigner)"
            exit 1
          fi

          echo "Using Android platform: $ANDROID_JAR"
          echo "Using AAPT2: $AAPT2"
          echo "Using D8: $D8"
          echo "Using ZipAlign: $ZIPALIGN"
          echo "Using Apksigner: $APKSIGNER"

          mkdir -p build_ci/gen build_ci/classes build_ci/dex build_ci/assets/www

          # 1. Copia asset statici del Web Remote (HTML, JS, CSS)
          cp -r akai-remote-web/* build_ci/assets/www/

          # 2. No embedded TLS private keys, including temporary/test ones.
          # Runtime TLS identity is generated/stored by TlsCertificateManager
          # in app-private storage. CI packaging should mirror release policy.
          # 3. AAPT2 compile resources
          "$AAPT2" compile --dir akai-remote-tv/app/src/main/res -o build_ci/compiled_res.zip

          # 4. AAPT2 link manifest and generate R.java
          "$AAPT2" link -I "$ANDROID_JAR" \
            --manifest akai-remote-tv/app/src/main/AndroidManifest.xml \
            -o build_ci/base.apk \
            --java build_ci/gen \
            build_ci/compiled_res.zip \
            --auto-add-overlay \
            --min-sdk-version 21 \
            --target-sdk-version 28

          # 5. Compile all 26 Java sources with javac
          JAVA_SRC=$(find akai-remote-tv/app/src/main/java build_ci/gen -name "*.java")
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -cp "$ANDROID_JAR" -d build_ci/classes $JAVA_SRC
          CLASS_COUNT=$(find build_ci/classes -name "*.class" | wc -l)
          echo "Java compilation succeeded: $CLASS_COUNT class files generated."

          # 6. Generate Dalvik Executable (classes.dex) with D8
          CLASS_FILES=$(find build_ci/classes -name "*.class")
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output build_ci/dex $CLASS_FILES

          # 7. Assemble APK: inject classes.dex, native ARMv7 library, and runtime assets
          (cd build_ci/dex && zip -u ../base.apk classes.dex)
          if [ -f build_ci/lib/armeabi-v7a/libakai_uinput.so ]; then
            (cd build_ci && zip -u base.apk lib/armeabi-v7a/libakai_uinput.so)
          fi
          (cd build_ci && zip -r -u base.apk assets)

          # 8. ZipAlign 4-byte boundary
          "$ZIPALIGN" -f -v 4 build_ci/base.apk build_ci/aligned.apk

          # 9. Firma con keystore effimero temporaneo di CI
          # AVVISO DI SICUREZZA: Il binario risultante viene designato come "app-ci-test-nondistributable.apk"
          # poiché firmato con chiave temporanea effimera e non utilizzabile per update del device reale.
          keytool -genkey -v -keystore /tmp/ci_debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug CI,O=AKAI JARVIS,C=IT"
          "$APKSIGNER" sign --ks /tmp/ci_debug.keystore --ks-pass pass:android --key-pass pass:android --out build_ci/app-ci-test-nondistributable.apk build_ci/aligned.apk

          # 10. Verify APK signature schemes (v1 + v2)
          "$APKSIGNER" verify --verbose build_ci/app-ci-test-nondistributable.apk

          # Ensure the AndroidManifest app icon/label can actually resolve, not only package/version.
          "$AAPT2" dump badging build_ci/app-ci-test-nondistributable.apk > build_ci/ci_badging.txt
          grep -q "package: name='it.akai.customremote'" build_ci/ci_badging.txt
          grep -q "versionCode='3'" build_ci/ci_badging.txt || (echo "FATAL: A2 preview must have versionCode 3" && exit 1)
          grep -q "versionName='1.2.0-a2-preview'" build_ci/ci_badging.txt || (echo "FATAL: wrong A2 versionName" && exit 1)
          grep -q "^application: label=" build_ci/ci_badging.txt
          echo "APK manifest package and application icon resources resolve successfully."

          APK_SIZE=$(stat -c%s build_ci/app-ci-test-nondistributable.apk)
          echo "CI TEST APK BUILT AND VERIFIED: $APK_SIZE bytes."

      - name: 6b. Actual AAPT2 compiled Debug v4 and non-Debug v5 manifest gates
        run: |
          set -euo pipefail
          # Source-grep checks alone cannot validate AAPT2 --debug-mode.
          # Reuse the resource ZIP from the Android9 compile, but create two
          # NEW unsigned resource-only APKs in an isolated temporary folder.
          # Never use an owner keystore or deploy either artifact.
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          ANDROID_28_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          if [ ! -x "$AAPT2" ] || [ ! -f "$ANDROID_28_JAR" ] || [ ! -s build_ci/compiled_res.zip ]; then
            echo "NO-GO: AAPT2 / android-28 platform / compiled resources missing"
            exit 1
          fi
          python3 akai-remote-tests/test_compiled_build_profiles.py \
            --aapt2 "$AAPT2" \
            --android-jar "$ANDROID_28_JAR" \
            --compiled-res build_ci/compiled_res.zip \
            --manifest akai-remote-tv/app/src/main/AndroidManifest.xml

      - name: 7. Explicit APK Contents Inspection and Verification (unzip -l)
        run: |
          set -euo pipefail
          echo "=== Verifying internal contents of candidate CI APK ==="
          unzip -l build_ci/app-ci-test-nondistributable.apk > build_ci/apk_contents.txt
          cat build_ci/apk_contents.txt

          echo "--- Verifying all required production components ---"
          grep "classes.dex" build_ci/apk_contents.txt || (echo "FATAL: classes.dex missing from APK!" && exit 1)
          grep "lib/armeabi-v7a/libakai_uinput.so" build_ci/apk_contents.txt || (echo "FATAL: libakai_uinput.so missing from APK!" && exit 1)
          grep "assets/www/index.html" build_ci/apk_contents.txt || (echo "FATAL: assets/www/index.html missing from APK!" && exit 1)
          grep "assets/www/app.js" build_ci/apk_contents.txt || (echo "FATAL: assets/www/app.js missing from APK!" && exit 1)
          grep "AndroidManifest.xml" build_ci/apk_contents.txt || (echo "FATAL: AndroidManifest.xml missing from APK!" && exit 1)
          if unzip -Z1 build_ci/app-ci-test-nondistributable.apk | grep -Ei '(^|/)(server_keystore|ca_key)|\.(p12|jks|key|der|crt|pass)$'; then
            echo "NO-GO: APK contains TLS/private signing material; NOT equivalent to production package."
            exit 1
          fi
          echo "MANDATORY APK COMPONENTS VERIFIED: DEX, Android ARMv7 SO, Web, no embedded TLS secrets."

      - name: "8. PowerShell Safe Install & Rollback Mock ADB Verification (45 Tests: Fail-Closed, WAL Tri-State, Quiescence, Preflight Dumpsys, Greenfield Safety, Strict TLS SAN/CA, .p12.bak, In-Place Rescue Zero-Uninstall, Strict Keystore Health, Watchdog Keystore Rescue Rollback, Candidate Hash Lock & Read-Only Accessibility Advisory)"
        shell: pwsh
        run: |
          ./akai-remote-tests/test_safe_install_mocked_adb.ps1

      - name: "8b. Portable Encrypted Recovery Bundle Export & Offline Restore Verification"
        shell: pwsh
        run: |
          ./akai-remote-tests/test_portable_recovery_bundle.ps1

      - name: "8c. A2 Rescue Builder Fail-Closed Provenance & Path Gates"
        shell: pwsh
        run: |
          ./akai-remote-tests/test_a2_rescue_builder_gates.ps1
