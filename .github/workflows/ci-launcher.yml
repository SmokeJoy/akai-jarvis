name: AKAI Launcher CI

on:
  push:
    branches: [ "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify-launcher:
    name: Build & Verify AKAI Custom Home v8 Leanback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Syntax Check Screenshots Script
        run: |
          echo "=== Syntax Checking Screenshots Script ==="
          node --check scripts/capture_leanback_screenshot.js
          echo "JavaScript syntax check passed."

      - name: 2. Secrets Leak Detection & Signing Hygiene Check
        run: |
          echo "=== Scanning for leaked credentials ==="
          FORBIDDEN_FILES=$(find . -type f \( -name "*.p12" -o -name "*.jks" -o -name "*.keystore" \) -not -path "*/.*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Forbidden private keystores detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          if grep -Eq '(--ks-pass|--key-pass).{0,24}pass:' scripts/09_compile_akai_home_apk.ps1; then
            echo "ERROR: Plaintext 'pass:' CLI argument detected in scripts/09_compile_akai_home_apk.ps1!"
            exit 1
          fi
          if grep -Eq '(\$StorePass|\$KeyPass)\b' scripts/09_compile_akai_home_apk.ps1; then
            echo "ERROR: Plaintext -StorePass/-KeyPass parameter detected in scripts/09_compile_akai_home_apk.ps1!"
            exit 1
          fi
          echo "Secrets scan passed: zero private keystores or CLI password literals detected."

      - name: 3. Verify Android Assets and Layout Structure
        run: |
          echo "=== Verifying Layout and Resource Integrity ==="
          test -f akai-custom-home/app/src/main/res/layout/activity_main.xml || (echo "activity_main.xml missing!" && exit 1)
          test -f akai-custom-home/app/src/main/res/layout/item_leanback_card.xml || (echo "item_leanback_card.xml missing!" && exit 1)
          test -f akai-custom-home/app/src/main/res/values/strings.xml || (echo "strings.xml missing!" && exit 1)
          test -f akai-custom-home/app/src/main/res/values/colors.xml || (echo "colors.xml missing!" && exit 1)
          test -f akai-custom-home/app/src/main/res/xml/akai_menu_service_config.xml || (echo "akai_menu_service_config.xml missing!" && exit 1)
          test -f akai-custom-home/app/src/main/java/it/akai/customhome/MainActivity.java || (echo "MainActivity.java missing!" && exit 1)
          test -f akai-custom-home/app/src/main/java/it/akai/customhome/AkaiMenuHomeService.java || (echo "AkaiMenuHomeService.java missing!" && exit 1)
          echo "All mandatory launcher source files present."

      - name: "Install Android API 28 Platform (Strict Android 9 Compatibility)"
        run: |
          echo "=== Installing Android Platform android-28 via sdkmanager ==="
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-28"
          test -f "$ANDROID_HOME/platforms/android-28/android.jar" || (echo "FATAL: android-28 platform installation failed!" && exit 1)
          echo "android-28 platform successfully installed and verified."

      - name: "4. Compile and Run Launcher Java Unit Tests (207 Tests - P0 Listener Reset, P1 Hidden OEM Reorder, Dynamic Metadata & Icon Diffing, Null Safety, D-Pad Repeats, AkaiMenuHomeService Fail-Open Passthrough)"
        run: |
          echo "=== Compiling and Running LauncherUnitTests (207 Tests) ==="
          mkdir -p test_bin
          APP_SRC=$(find akai-custom-home/app/src/main/java -name "*.java")
          MOCK_SRC=$(find akai-custom-home/test/host_mock -name "*.java")
          javac -encoding UTF-8 -d test_bin \
            $MOCK_SRC \
            $APP_SRC \
            akai-custom-home/test/it/akai/customhome/LauncherUnitTests.java

          java -cp test_bin it.akai.customhome.LauncherUnitTests
          echo "All 207 Launcher unit tests passed successfully."

      - name: "5. Run ADB Isolation & Safety Unit Tests (Script 11 - 7 Fail-Closed Scenarios)"
        shell: pwsh
        run: |
          Write-Host "=== Running ADB Fail-Closed Isolation Safety Tests (P0 Suite) ==="
          pwsh -File scripts/11_test_emulator_smoke_script_isolation.ps1
          Write-Host "ADB Fail-Closed Isolation Safety Suite passed 100% in CI."

      - name: "6. Compile Standalone AKAI Custom Home v8 Leanback APK with AAPT2, Javac and D8 (Strict Android API 28)"
        run: |
          echo "=== Building AKAI Custom Home v8 APK in CI ==="
          # Vincolo tassativo: DEVE essere la piattaforma Android API 28 (Android 9)
          ANDROID_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            echo "FATAL: android-28 platform jar missing at $ANDROID_JAR"
            exit 1
          fi
          echo "STRICT ANDROID 9 PLATFORM JAR: $ANDROID_JAR"

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          mkdir -p build_launcher_ci/gen build_launcher_ci/classes build_launcher_ci/dex

          # 1. AAPT2 compile resources
          "$AAPT2" compile --dir akai-custom-home/app/src/main/res -o build_launcher_ci/compiled_res.zip

          # 2. AAPT2 link manifest and generate R.java (candidate versionCode=11, 8.2.1)
          "$AAPT2" link -I "$ANDROID_JAR" \
            --manifest akai-custom-home/app/src/main/AndroidManifest.xml \
            -o build_launcher_ci/base.apk \
            --java build_launcher_ci/gen \
            build_launcher_ci/compiled_res.zip \
            --auto-add-overlay \
            --min-sdk-version 21 \
            --target-sdk-version 28 \
            --version-code 11 \
            --version-name "8.2.1"

          # 3. Compile Java sources
          JAVA_SRC=$(find akai-custom-home/app/src/main/java build_launcher_ci/gen -name "*.java")
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -cp "$ANDROID_JAR" -d build_launcher_ci/classes $JAVA_SRC
          test -f build_launcher_ci/classes/it/akai/customhome/AkaiMenuHomeService.class || (echo "FATAL: AkaiMenuHomeService.class not generated!" && exit 1)
          echo "Java compilation succeeded (including AkaiMenuHomeService)."

          # 4. Generate DEX with D8
          CLASS_FILES=$(find build_launcher_ci/classes -name "*.class")
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output build_launcher_ci/dex $CLASS_FILES

          # 5. Assemble APK
          (cd build_launcher_ci/dex && zip -u ../base.apk classes.dex)

          # 6. ZipAlign
          "$ZIPALIGN" -f -v 4 build_launcher_ci/base.apk build_launcher_ci/aligned.apk

          # 7. Ephemeral test key sign (NON-DISTRIBUTABLE CI TEST BUILD)
          keytool -genkey -v -keystore /tmp/ci_launcher.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Launcher CI,O=AKAI Home,C=IT"
          "$APKSIGNER" sign --ks /tmp/ci_launcher.keystore --ks-pass pass:android --key-pass pass:android --out build_launcher_ci/akai-custom-home-v8-vc11-ci-test-nondistributable.apk build_launcher_ci/aligned.apk

          # 8. Verify
          "$APKSIGNER" verify --verbose --print-certs build_launcher_ci/akai-custom-home-v8-vc11-ci-test-nondistributable.apk
          echo "AKAI CUSTOM HOME v8 (vc=11) CI BUILD SUCCESSFUL (NON-DISTRIBUTABLE TEST ARTIFACT)."

      - name: "7. Inspect APK Internal Contents & Manifest Metadata"
        run: |
          echo "=== Verifying internal contents of candidate Launcher APK ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          APK="build_launcher_ci/akai-custom-home-v8-vc11-ci-test-nondistributable.apk"
          unzip -l "$APK" > build_launcher_ci/apk_contents.txt
          cat build_launcher_ci/apk_contents.txt
          grep "classes.dex" build_launcher_ci/apk_contents.txt || (echo "FATAL: classes.dex missing from Launcher APK!" && exit 1)
          grep "AndroidManifest.xml" build_launcher_ci/apk_contents.txt || (echo "FATAL: AndroidManifest.xml missing from Launcher APK!" && exit 1)
          grep "res/layout/activity_main.xml" build_launcher_ci/apk_contents.txt || (echo "FATAL: activity_main.xml missing from Launcher APK!" && exit 1)
          grep "res/layout/item_leanback_card.xml" build_launcher_ci/apk_contents.txt || (echo "FATAL: item_leanback_card.xml missing from Launcher APK!" && exit 1)
          grep "res/xml/akai_menu_service_config.xml" build_launcher_ci/apk_contents.txt || (echo "FATAL: akai_menu_service_config.xml missing from Launcher APK!" && exit 1)
          ("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null || "$AAPT2" dump --file AndroidManifest.xml "$APK") > build_launcher_ci/manifest_tree.txt
          cat build_launcher_ci/manifest_tree.txt
          grep -q 'package="it.akai.customhome"' build_launcher_ci/manifest_tree.txt || (echo "FATAL: unexpected package in manifest!" && exit 1)
          grep -Eq 'versionCode.*=11|versionCode.*0xb' build_launcher_ci/manifest_tree.txt || (echo "FATAL: versionCode=11 missing in manifest!" && exit 1)
          grep -q 'AkaiMenuHomeService' build_launcher_ci/manifest_tree.txt || (echo "FATAL: AkaiMenuHomeService missing from manifest!" && exit 1)
          if grep -q 'E: provider' build_launcher_ci/manifest_tree.txt; then
            echo "FATAL: unexpected ContentProvider found!" && exit 1
          fi
          echo "ALL MANDATORY LAUNCHER ARTIFACTS VERIFIED INSIDE APK (vc=11, zero providers, AkaiMenuHomeService present)."

      - name: "8. Verify Parallel Candidate Packaging & Static Isolation (it.akai.customhome.v8)"
        run: |
          echo "=== Building & Statically Validating Parallel Candidate APK (it.akai.customhome.v8, vc=11, with HOME intent) ==="
          ANDROID_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          mkdir -p build_parallel_ci/gen build_parallel_ci/classes build_parallel_ci/dex

          "$AAPT2" compile --dir akai-custom-home/app/src/main/res -o build_parallel_ci/compiled_res.zip
          "$AAPT2" link -I "$ANDROID_JAR" \
            --manifest akai-custom-home/app/src/main/AndroidManifest.xml \
            -o build_parallel_ci/base.apk \
            --java build_parallel_ci/gen \
            build_parallel_ci/compiled_res.zip \
            --auto-add-overlay \
            --min-sdk-version 21 \
            --target-sdk-version 28 \
            --version-code 11 \
            --version-name "8.2.1" \
            --rename-manifest-package it.akai.customhome.v8 \
            --custom-package it.akai.customhome

          JAVA_SRC=$(find akai-custom-home/app/src/main/java build_parallel_ci/gen -name "*.java")
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -cp "$ANDROID_JAR" -d build_parallel_ci/classes $JAVA_SRC
          test -f build_parallel_ci/classes/it/akai/customhome/AkaiMenuHomeService.class || (echo "FATAL: AkaiMenuHomeService.class not generated in parallel build!" && exit 1)
          CLASS_FILES=$(find build_parallel_ci/classes -name "*.class")
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output build_parallel_ci/dex $CLASS_FILES
          (cd build_parallel_ci/dex && zip -u ../base.apk classes.dex)
          "$ZIPALIGN" -f -v 4 build_parallel_ci/base.apk build_parallel_ci/aligned.apk
          "$APKSIGNER" sign --ks /tmp/ci_launcher.keystore --ks-pass pass:android --key-pass pass:android --out build_parallel_ci/akai-custom-home-parallel-vc11-ci-test-nondistributable.apk build_parallel_ci/aligned.apk
          "$APKSIGNER" verify --verbose build_parallel_ci/akai-custom-home-parallel-vc11-ci-test-nondistributable.apk

          ("$AAPT2" dump xmltree --file AndroidManifest.xml build_parallel_ci/akai-custom-home-parallel-vc11-ci-test-nondistributable.apk 2>/dev/null || "$AAPT2" dump --file AndroidManifest.xml build_parallel_ci/akai-custom-home-parallel-vc11-ci-test-nondistributable.apk) > build_parallel_ci/manifest_tree.txt
          cat build_parallel_ci/manifest_tree.txt
          grep -q 'package="it.akai.customhome.v8"' build_parallel_ci/manifest_tree.txt || (echo "FATAL: parallel package rename failed!" && exit 1)
          grep -q '"it.akai.customhome.MainActivity"' build_parallel_ci/manifest_tree.txt || (echo "FATAL: MainActivity component resolution failed!" && exit 1)
          grep -q '"it.akai.customhome.AkaiMenuHomeService"' build_parallel_ci/manifest_tree.txt || (echo "FATAL: AkaiMenuHomeService component resolution failed!" && exit 1)
          grep -Eq 'versionCode.*=11|versionCode.*0xb' build_parallel_ci/manifest_tree.txt || (echo "FATAL: parallel versionCode=11 missing!" && exit 1)
          grep -q 'android.intent.category.HOME' build_parallel_ci/manifest_tree.txt || (echo "FATAL: CATEGORY_HOME missing in candidate manifest!" && exit 1)
          unzip -l build_parallel_ci/akai-custom-home-parallel-vc11-ci-test-nondistributable.apk | grep "res/xml/akai_menu_service_config.xml" || (echo "FATAL: akai_menu_service_config.xml missing from APK!" && exit 1)
          if grep -q 'E: provider' build_parallel_ci/manifest_tree.txt; then
            echo "FATAL: unexpected ContentProvider in parallel APK!" && exit 1
          fi
          echo "PARALLEL CANDIDATE VERIFIED (package=it.akai.customhome.v8, vc=11, with HOME filter, AkaiMenuHomeService present, zero providers)."
