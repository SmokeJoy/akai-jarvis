<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Remote Icon Outline -->
  <rect x="156" y="80" width="200" height="352" rx="44" fill="#181a22" stroke="url(#primary)" stroke-width="8" />
  
  <!-- Power LED -->
  <circle cx="256" cy="120" r="10" fill="#ef4444" />
  
  <!-- D-Pad Circle -->
  <circle cx="256" cy="220" r="64" fill="#212430" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  <circle cx="256" cy="220" r="26" fill="url(#primary)" />
  
  <!-- Navigation Dots -->
  <circle cx="256" cy="178" r="6" fill="#94a3b8" />
  <circle cx="256" cy="262" r="6" fill="#94a3b8" />
  <circle cx="214" cy="220" r="6" fill="#94a3b8" />
  <circle cx="298" cy="220" r="6" fill="#94a3b8" />
  
  <!-- Buttons -->
  <rect x="186" y="310" width="60" height="24" rx="8" fill="#272b38" />
  <rect x="266" y="310" width="60" height="24" rx="8" fill="#272b38" />
  <rect x="186" y="350" width="60" height="24" rx="8" fill="#272b38" />
  <rect x="266" y="350" width="60" height="24" rx="8" fill="#272b38" />
  
  <!-- Brand text -->
  <text x="256" y="405" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="3">AKAI</text>
